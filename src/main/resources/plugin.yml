main: de.marktwerk.MarktWerk
api-version: '1.21.11'
softdepend: [Vault, floodgate, Geyser-Spigot]
commands:
  markt:
    description: Economy menu and administration
    usage: /markt
permissions:
  marktwerk.use:
    default: true
  marktwerk.transfer:
    default: true
  marktwerk.server:
    default: true
  marktwerk.chest:
